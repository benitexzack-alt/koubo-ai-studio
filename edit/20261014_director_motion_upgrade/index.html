<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导演升级一分钟对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#131b20;color:#f5f2eb;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}main{max-width:1600px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 10px}p{color:#bac5ca;line-height:1.6;font-size:15px}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}button,a{border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer}button{background:#2d3a42;color:#f5f2eb}button.active{background:#dfb86c;color:#16232b}.players{display:grid;grid-template-columns:1fr;gap:22px}.players.compare{grid-template-columns:1fr 1fr}video{width:100%;background:#000;display:block;border-radius:8px}.label{display:flex;justify-content:space-between;font-size:16px;margin:0 0 10px;color:#eee6d4}#old-box{display:none}.compare #old-box{display:block}.note{font-size:14px;color:#94a6ae;margin-top:18px}a{color:#dfb86c;padding-left:0;font-size:14px}@media(max-width:850px){main{padding:18px}.players.compare{grid-template-columns:1fr}}
</style><main><h1>导演升级，一分钟看变化</h1><p>《企业全员AI改造》53.47—113.40 秒，同一段实录，原速播放。当前为待审候选。</p><div class="bar"><button class="active" id="single">看升级版 · 含动作音</button><button id="compare">原版 / 升级版对照</button><button id="sync">一起播放</button><button id="reset">回到开头</button></div><div class="bar"><button data-jump="14.2">沉淀期 · 14秒</button><button data-jump="18">纸艺交接 · 18秒</button><button data-jump="36">标签累积 · 36秒</button><button data-jump="57">选择对照 · 57秒</button></div><div class="players" id="players"><section id="old-box"><div class="label">原版画面<span>同一段实录</span></div><video id="old" controls preload="metadata" playsinline src="outputs/企业全员AI改造_原版同窗_统一底声.mp4"></video></section><section><div class="label" id="new-label">升级版<span>含新增动作音</span></div><video id="new" controls preload="metadata" playsinline src="outputs/企业全员AI改造_导演升级_一分钟_R1_有音效.mp4"></video></section></div><p class="note" id="note">重点看：同一容器如何承接语义，标签如何累积，真人如何让位和回归，结尾如何形成对照。声音是否自然，仍需正常音量试听。</p><p><a href="outputs/企业全员AI改造_导演升级_一分钟_R1_有音效.mp4">单独打开升级版</a></p></main><script>
const n=document.getElementById('new'),o=document.getElementById('old'),p=document.getElementById('players');let mode='single',syncing=false;
function setMode(m){const t=n.currentTime||0;n.pause();o.pause();mode=m;const both=m==='compare';p.classList.toggle('compare',both);document.getElementById('single').classList.toggle('active',!both);document.getElementById('compare').classList.toggle('active',both);n.src=both?'outputs/企业全员AI改造_导演升级_一分钟_R1_有音效.mp4':'outputs/企业全员AI改造_导演升级_一分钟_R1_有音效.mp4';n.addEventListener('loadedmetadata',()=>{n.currentTime=t;if(both)o.currentTime=t},{once:true});o.muted=true;n.muted=false;document.getElementById('new-label').innerHTML=both?'升级版画面<span>同一段实录</span>':'升级版<span>含新增动作音</span>';document.getElementById('note').textContent=both?'两边播放同一段实录，只播放右侧升级版声音，左侧静音。可同步比较画面编排；两版均为原速。':'重点看：同一容器如何承接语义，标签如何累积，真人如何让位和回归，结尾如何形成对照。声音是否自然，仍需正常音量试听。'}
document.getElementById('single').onclick=()=>setMode('single');document.getElementById('compare').onclick=()=>setMode('compare');document.getElementById('reset').onclick=()=>{n.pause();o.pause();n.currentTime=0;o.currentTime=0};document.getElementById('sync').onclick=async()=>{if(n.paused){if(mode==='compare'){o.currentTime=n.currentTime;await o.play()}await n.play()}else{n.pause();o.pause()}};
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{n.pause();o.pause();n.currentTime=Number(b.dataset.jump);if(mode==='compare')o.currentTime=n.currentTime});
n.addEventListener('play',()=>{if(mode==='compare'){o.currentTime=n.currentTime;o.play()}});n.addEventListener('pause',()=>o.pause());n.addEventListener('seeking',()=>{if(mode==='compare'&&!syncing){syncing=true;o.currentTime=n.currentTime;syncing=false}});n.addEventListener('timeupdate',()=>{if(mode==='compare'&&!n.paused&&Math.abs(o.currentTime-n.currentTime)>.15)o.currentTime=n.currentTime});
</script></html>
