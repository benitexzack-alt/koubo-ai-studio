<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#e9dfcf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b1620" flood-opacity="0.13"/>
    </filter>
    <pattern id="fibres" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M0 15 Q12 11 24 16 T48 16" fill="none" stroke="#9d8d77" stroke-width="1" opacity="0.12"/>
      <path d="M7 34 Q18 29 31 35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#fibres)"/>
  <rect x="0" y="0" width="28" height="1080" fill="#e85f45"/>
  <text x="96" y="88" font-family="Noto Sans CJK SC" font-size="28" font-weight="600" fill="#e85f45" letter-spacing="3">码头装卸效率 · 装船处理成本</text>
  <text x="96" y="175" font-family="Noto Sans CJK SC" font-size="68" font-weight="900" fill="#152436">集装箱效率与成本</text>
  <g filter="url(#shadow)">
    <rect x="96" y="270" width="820" height="560" rx="38" fill="#fffaf2"/>
    <rect x="1004" y="270" width="820" height="560" rx="38" fill="#fffaf2"/>
  </g>
  <text x="150" y="350" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#2d5f89">码头装卸生产率</text>
  <text x="150" y="510" font-family="Noto Sans CJK SC" font-size="88" font-weight="900" fill="#152436">1.4</text>
  <path d="M385 480 H555" stroke="#e85f45" stroke-width="16" stroke-linecap="round"/><path d="M555 480 l-36 -27 v54 z" fill="#e85f45"/>
  <text x="610" y="510" font-family="Noto Sans CJK SC" font-size="88" font-weight="900" fill="#152436">30</text>
  <text x="150" y="590" font-family="Noto Sans CJK SC" font-size="32" fill="#637080">吨 / 人时</text>
  <text x="150" y="700" font-family="Noto Sans CJK SC" font-size="58" font-weight="900" fill="#e85f45">约 21 倍</text>
  <text x="150" y="775" font-family="Noto Sans CJK SC" font-size="23" fill="#637080">美国联邦上诉法院判决记录中引用的估算</text>

  <text x="1058" y="350" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#2d5f89">一次历史案例的装船处理成本</text>
  <text x="1058" y="510" font-family="Noto Sans CJK SC" font-size="78" font-weight="900" fill="#152436">$5.83</text>
  <path d="M1360 480 H1500" stroke="#e85f45" stroke-width="16" stroke-linecap="round"/><path d="M1500 480 l-36 -27 v54 z" fill="#e85f45"/>
  <text x="1540" y="510" font-family="Noto Sans CJK SC" font-size="78" font-weight="900" fill="#152436">$0.158</text>
  <text x="1058" y="590" font-family="Noto Sans CJK SC" font-size="32" fill="#637080">美元 / 吨</text>
  <text x="1058" y="700" font-family="Noto Sans CJK SC" font-size="58" font-weight="900" fill="#e85f45">约下降 97%</text>
  <text x="1058" y="775" font-family="Noto Sans CJK SC" font-size="23" fill="#637080">USC Sea Grant 文章引用 Levinson（2006）</text>
  <rect x="96" y="870" width="1728" height="102" rx="24" fill="#152436"/>
  <text x="960" y="914" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="900" fill="#fff">装船处理成本 ≠ 整体运输成本</text>
  <text x="960" y="954" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" fill="#fff">这些数据能支持码头效率与装船处理成本改善，不能等同于整体运输成本下降 90%</text>

  <line x1="96" y1="1004" x2="1824" y2="1004" stroke="#b5aa99" stroke-width="2"/>
  <text x="96" y="1045" font-family="Noto Sans CJK SC" font-size="23" fill="#637080">来源：美国联邦上诉法院判决文书 · USC Sea Grant</text>
</svg>
