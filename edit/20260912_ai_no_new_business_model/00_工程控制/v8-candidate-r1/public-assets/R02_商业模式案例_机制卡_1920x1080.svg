<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#e9dfcf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b1620" flood-opacity="0.13"/>
    </filter>
    <pattern id="fibres" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M0 15 Q12 11 24 16 T48 16" fill="none" stroke="#9d8d77" stroke-width="1" opacity="0.12"/>
      <path d="M7 34 Q18 29 31 35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#fibres)"/>
  <rect x="0" y="0" width="28" height="1080" fill="#e85f45"/>
  <text x="96" y="88" font-family="Noto Sans CJK SC" font-size="28" font-weight="600" fill="#e85f45" letter-spacing="3">改变“谁来提供”和“怎么付费”</text>
  <text x="96" y="175" font-family="Noto Sans CJK SC" font-size="68" font-weight="900" fill="#152436">商业模式案例</text>
  <g filter="url(#shadow)">
    <rect x="96" y="250" width="396" height="620" rx="34" fill="#fffaf2"/>
    <rect x="530" y="250" width="396" height="620" rx="34" fill="#fffaf2"/>
    <rect x="964" y="250" width="396" height="620" rx="34" fill="#fffaf2"/>
    <rect x="1398" y="250" width="426" height="620" rx="34" fill="#fffaf2"/>
  </g>
  <circle cx="172" cy="330" r="38" fill="#e85f45"/><text x="172" y="342" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="34" font-weight="900" fill="#fff">1</text>
  <text x="142" y="420" font-family="Noto Sans CJK SC" font-size="35" font-weight="900" fill="#152436"><tspan x="142" dy="0em">按需运力</tspan><tspan x="142" dy="1.35em">Uber</tspan></text>
  <text x="142" y="560" font-family="Noto Sans CJK SC" font-size="27" fill="#637080"><tspan x="142" dy="0em">发出行程请求</tspan><tspan x="142" dy="1.45em">↓</tspan><tspan x="142" dy="1.45em">平台匹配司机</tspan></text>

  <circle cx="606" cy="330" r="38" fill="#c18b3b"/><text x="606" y="342" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="34" font-weight="900" fill="#fff">2</text>
  <text x="576" y="420" font-family="Noto Sans CJK SC" font-size="35" font-weight="900" fill="#152436"><tspan x="576" dy="0em">空间供给</tspan><tspan x="576" dy="1.35em">Airbnb</tspan></text>
  <text x="576" y="560" font-family="Noto Sans CJK SC" font-size="27" fill="#637080"><tspan x="576" dy="0em">房东发布空间</tspan><tspan x="576" dy="1.45em">↓</tspan><tspan x="576" dy="1.45em">房客预订住宿</tspan></text>

  <circle cx="1040" cy="330" r="38" fill="#2d5f89"/><text x="1040" y="342" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="34" font-weight="900" fill="#fff">3</text>
  <text x="1010" y="420" font-family="Noto Sans CJK SC" font-size="35" font-weight="900" fill="#152436"><tspan x="1010" dy="0em">软件订阅</tspan><tspan x="1010" dy="1.35em">SaaS</tspan></text>
  <text x="1010" y="560" font-family="Noto Sans CJK SC" font-size="27" fill="#637080"><tspan x="1010" dy="0em">云端软件服务</tspan><tspan x="1010" dy="1.45em">↓</tspan><tspan x="1010" dy="1.45em">按年/月订阅</tspan></text>

  <circle cx="1474" cy="330" r="38" fill="#4d7e6a"/><text x="1474" y="342" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="34" font-weight="900" fill="#fff">4</text>
  <text x="1444" y="420" font-family="Noto Sans CJK SC" font-size="35" font-weight="900" fill="#152436"><tspan x="1444" dy="0em">社交拼购</tspan><tspan x="1444" dy="1.35em">京喜拼购</tspan></text>
  <text x="1444" y="560" font-family="Noto Sans CJK SC" font-size="27" fill="#637080"><tspan x="1444" dy="0em">发起/参与拼购</tspan><tspan x="1444" dy="1.45em">↓</tspan><tspan x="1444" dy="1.45em">共享活动入口</tspan></text>
  <rect x="96" y="906" width="1728" height="66" rx="20" fill="#152436"/>
  <text x="960" y="950" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="#fff">这些页面只说明案例机制，不单独证明“全新商业模式”</text>

  <line x1="96" y1="1004" x2="1824" y2="1004" stroke="#b5aa99" stroke-width="2"/>
  <text x="96" y="1045" font-family="Noto Sans CJK SC" font-size="23" fill="#637080">来源：Uber · Airbnb · 腾讯云 SaaS · 京喜拼购官方页面</text>
</svg>
