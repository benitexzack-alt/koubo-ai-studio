<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#e9dfcf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b1620" flood-opacity="0.13"/>
    </filter>
    <pattern id="fibres" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M0 15 Q12 11 24 16 T48 16" fill="none" stroke="#9d8d77" stroke-width="1" opacity="0.12"/>
      <path d="M7 34 Q18 29 31 35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#fibres)"/>
  <rect x="0" y="0" width="28" height="1080" fill="#e85f45"/>
  <text x="96" y="88" font-family="Noto Sans CJK SC" font-size="28" font-weight="600" fill="#e85f45" letter-spacing="3">从人工假设，到数据驱动的优化</text>
  <text x="96" y="175" font-family="Noto Sans CJK SC" font-size="68" font-weight="900" fill="#152436">广告投放机制</text>
  <g filter="url(#shadow)">
    <rect x="96" y="270" width="490" height="560" rx="36" fill="#fffaf2"/>
    <rect x="715" y="270" width="490" height="560" rx="36" fill="#fffaf2"/>
    <rect x="1334" y="270" width="490" height="560" rx="36" fill="#fffaf2"/>
  </g>
  <text x="150" y="350" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="#2d5f89">01 · 广告主给输入</text>
  <text x="150" y="445" font-family="Noto Sans CJK SC" font-size="40" font-weight="900" fill="#152436"><tspan x="150" dy="0em">业务目标</tspan><tspan x="150" dy="1.45em">预算与出价</tspan><tspan x="150" dy="1.45em">素材与转化数据</tspan></text>
  <text x="150" y="690" font-family="Noto Sans CJK SC" font-size="25" fill="#637080"><tspan x="150" dy="0em">转化跟踪和回传数据</tspan><tspan x="150" dy="1.45em">是模型学习的重要基础</tspan></text>

  <path d="M608 550 H688" stroke="#e85f45" stroke-width="16" stroke-linecap="round"/><path d="M688 550 l-34 -26 v52 z" fill="#e85f45"/>
  <text x="769" y="350" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="#2d5f89">02 · AI 做优化</text>
  <text x="769" y="445" font-family="Noto Sans CJK SC" font-size="40" font-weight="900" fill="#152436"><tspan x="769" dy="0em">评估更多信号</tspan><tspan x="769" dy="1.45em">预测转化概率</tspan><tspan x="769" dy="1.45em">逐次竞价调整</tspan></text>
  <text x="769" y="690" font-family="Noto Sans CJK SC" font-size="25" fill="#637080"><tspan x="769" dy="0em">可以超出已填写的受众信号</tspan><tspan x="769" dy="1.45em">寻找更可能转化的人群</tspan></text>

  <path d="M1227 550 H1307" stroke="#e85f45" stroke-width="16" stroke-linecap="round"/><path d="M1307 550 l-34 -26 v52 z" fill="#e85f45"/>
  <text x="1388" y="350" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="#2d5f89">03 · 产出可验证</text>
  <text x="1388" y="445" font-family="Noto Sans CJK SC" font-size="40" font-weight="900" fill="#152436"><tspan x="1388" dy="0em">更多匹配机会</tspan><tspan x="1388" dy="1.45em">更准的出价</tspan><tspan x="1388" dy="1.45em">报表与实验</tspan></text>
  <text x="1388" y="690" font-family="Noto Sans CJK SC" font-size="25" fill="#637080"><tspan x="1388" dy="0em">用真实转化和长周期数据</tspan><tspan x="1388" dy="1.45em">判断是否真正提效</tspan></text>
  <rect x="96" y="870" width="1728" height="102" rx="24" fill="#152436"/>
  <text x="960" y="914" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="900" fill="#fff">不是“一键找到所有客户”</text>
  <text x="960" y="954" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" fill="#fff">效果依赖数据、素材、预算和业务基础，不保证覆盖扩大或成本下降</text>

  <line x1="96" y1="1004" x2="1824" y2="1004" stroke="#b5aa99" stroke-width="2"/>
  <text x="96" y="1045" font-family="Noto Sans CJK SC" font-size="23" fill="#637080">来源：巨量引擎 · Google Ads 官方说明</text>
</svg>
